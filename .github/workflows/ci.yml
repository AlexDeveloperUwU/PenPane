name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Cache toolchain
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}\tools
          key: llvm-mingw-20261117-ucrt-x86_64

      - name: Install toolchain
        id: toolchain
        shell: powershell
        run: |
          $path = powershell -NoProfile -ExecutionPolicy Bypass -File scripts\setup-toolchain.ps1 -Root "$env:RUNNER_TEMP\tools"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "path=$($path | Select-Object -Last 1)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Check formatting
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\format.ps1 -Check -Toolchain "${{ steps.toolchain.outputs.path }}"

      - name: Lint
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\lint.ps1 -Toolchain "${{ steps.toolchain.outputs.path }}"

      - name: Build
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\package.ps1 -Toolchain "${{ steps.toolchain.outputs.path }}"

      - name: Test
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\test.ps1 -Toolchain "${{ steps.toolchain.outputs.path }}"

      - name: Upload executables
        uses: actions/upload-artifact@v7
        with:
          name: penpane
          path: |
            build/PenPane.exe
            build/PenPane-Setup-*.exe
            build/*.sha256
          if-no-files-found: error
