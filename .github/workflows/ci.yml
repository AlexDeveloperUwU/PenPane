name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install toolchain
        id: toolchain
        shell: powershell
        run: |
          $path = powershell -NoProfile -ExecutionPolicy Bypass -File scripts\setup-toolchain.ps1 -Root "$env:RUNNER_TEMP\tools"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "path=$($path | Select-Object -Last 1)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Build
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\build.ps1 -Toolchain "${{ steps.toolchain.outputs.path }}"

      - name: Test
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\test.ps1 -Toolchain "${{ steps.toolchain.outputs.path }}"

      - name: Upload executable
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: penpane
          path: build/penpane.exe
          if-no-files-found: error
