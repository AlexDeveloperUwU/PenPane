name: Bug report
description: Something does not work as documented
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for the report. Check the docs folder first. Security problems must not be reported here: follow SECURITY.md.
  - type: input
    id: version
    attributes:
      label: PenPane version
      description: Shown in the file properties of penpane.exe and in the tray tooltip.
      placeholder: "0.2.0"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: "Windows 11 23H2"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: Setup
      description: Pen or tablet model and driver, number of monitors, display scaling, and any relevant lines of penpane.ini.
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I read the limitations in the README.
          required: true
